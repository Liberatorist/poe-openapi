name: Regenerate OpenAPI specs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate-and-deploy
  cancel-in-progress: false

jobs:
  generate:
    # On push events only redeploy the page; regeneration runs on schedule/manual trigger
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generator
        run: |
          mkdir -p out
          python generate.py

      - name: Validate specs
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator out/*.json out/*.yaml

      - name: Commit changes if any
        run: |
          git add out/*.json out/*.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated OpenAPI specs"
          git push

  deploy-pages:
    needs: generate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site/out
          cp index.html _site/
          cp out/*.json out/*.yaml _site/out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
