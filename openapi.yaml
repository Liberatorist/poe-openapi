openapi: 3.0.0
info:
  title: Path of Exile API
  version: 3.26.0
paths:
  /profile:
    get:
      summary: Get Profile
      operationId: GetProfile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    description: UUIDv4 in canonical format
                  name:
                    type: string
                  locale:
                    type: string
                  twitch:
                    type: object
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    description: present if the account is Twitch-linked
                required:
                - name
                - uuid
      security:
      - bearerAuth: []
      - account:
        - account:profile
      tags:
      - Account Profile
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
  /item-filter:
    get:
      summary: Get Item Filters
      operationId: GetItemFilters
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemFilter'
                required:
                - filters
      security:
      - bearerAuth: []
      - account:
        - account:item_filter
      tags:
      - Account Item Filters
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
    post:
      summary: Create Item Filter
      operationId: CreateItemFilter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    $ref: '#/components/schemas/ItemFilter'
                required:
                - filter
      security:
      - bearerAuth: []
      - account:
        - account:item_filter
      tags:
      - Account Item Filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter_name:
                  type: string
                realm:
                  type: string
                  enum:
                  - pc
                  - xbox
                  - sony
                  - poe2
                  description: pc, xbox, sony, or poe2
                description:
                  type: string
                version:
                  type: string
                type:
                  type: string
                  enum:
                  - Normal
                  - Ruthless
                  description: either Normal or Ruthless
                public:
                  type: boolean
                  enum:
                  - false
                  description: defaults to false
                filter:
                  type: string
              required:
              - filter
              - filter_name
              - realm
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - description: set to true to validate the filter against the current game version
        name: validate
        in: query
        required: false
        schema:
          type: string
  /item-filter/{id}:
    get:
      summary: Get Item Filter
      operationId: GetItemFilter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    $ref: '#/components/schemas/ItemFilter'
                required:
                - filter
      security:
      - bearerAuth: []
      - account:
        - account:item_filter
      tags:
      - Account Item Filters
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update Item Filter
      operationId: UpdateItemFilter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    $ref: '#/components/schemas/ItemFilter'
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        enum:
                        - 200
                        - 202
                        - 400
                        - 404
                        - 429
                        - 500
                      message:
                        type: string
                    description: an "Accepted" error object
                required:
                - filter
      security:
      - bearerAuth: []
      - account:
        - account:item_filter
      tags:
      - Account Item Filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter_name:
                  type: string
                realm:
                  type: string
                  enum:
                  - pc
                  - xbox
                  - sony
                  - poe2
                  description: pc, xbox, sony, or poe2
                description:
                  type: string
                version:
                  type: string
                type:
                  type: string
                  enum:
                  - Normal
                  - Ruthless
                  description: either Normal or Ruthless
                public:
                  type: boolean
                  enum:
                  - true
                  description: must be true if present
                filter:
                  type: string
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - description: set to true to validate the filter against the current game version
        name: validate
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
  /league:
    get:
      summary: List Leagues
      operationId: ListLeagues
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  leagues:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
                required:
                - leagues
      security:
      - bearerAuth: []
      - service:
        - service:leagues
      tags:
      - Leagues
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - description: can be pc (default), xbox , sony , or poe2
        name: realm
        in: query
        required: false
        schema:
          type: string
      - description: 'type can be one of the following: main retrieves permanent and
          current challenge leagues (default)

          event retrieves current event leagues

          season (PoE1 only) retrieves leagues in a particular season. Use season
          to set the season to query'
        name: type
        in: query
        required: false
        schema:
          type: string
      - description: restricts the amount of results returned. Maximum is 50 (default)
        name: limit
        in: query
        required: false
        schema:
          type: string
      - description: can be used with limit above to scroll through the list
        name: offset
        in: query
        required: false
        schema:
          type: string
  /league/{league}:
    get:
      summary: Get League
      operationId: GetLeague
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  league:
                    $ref: '#/components/schemas/League'
      security:
      - bearerAuth: []
      - service:
        - service:leagues
      tags:
      - Leagues
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - description: can be pc (default), xbox , sony , or poe2
        name: realm
        in: query
        required: false
        schema:
          type: string
      - name: league
        in: path
        required: true
        schema:
          type: string
  /league/{league}/ladder:
    get:
      summary: Get League Ladder
      operationId: GetLeagueLadder
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  league:
                    $ref: '#/components/schemas/League'
                  ladder:
                    type: object
                    properties:
                      total:
                        type: integer
                        format: uint32
                      cached_since:
                        type: string
                        format: date time (ISO8601)
                      entries:
                        type: array
                        items:
                          $ref: '#/components/schemas/LadderEntry'
                    required:
                    - entries
                    - total
                required:
                - ladder
                - league
      security:
      - bearerAuth: []
      - service:
        - service:leagues
      tags:
      - Leagues
      parameters:
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
        description: 'format: OAuth {$clientId}/{$version} (contact: {$contact})'
      - description: can be pc (default), xbox , or sony
        name: realm
        in: query
        required: false
        schema:
          type: string
      - description: "sort can be one of the following: xp sorts the ladder by experience\n\
          depth sorts the ladder by Delve depth\ndepthsolo sorts the ladder by Delve\
          \ (Solo) depth\nancestor sorts the ladder by Ancestor rank\ntime sorts the\
          \ ladder by objective finish time\nscore sorts the ladder by objective score\n\
          \nclass returns characters of a specific class sorted by experience. Use\
          \ class to set the class. Options are:\n                \nscion\nmarauder\n\
          ranger\nwitch\nduelist\ntemplar\nshadow  The default sort type will either\
          \ be xp or time depending on the league."
        name: sort
        in: query
        required: false
        schema:
          type: string
      - description: restricts the amount of results returned. Default is 20. Maximum
          is 500
        name: limit
        in: query
        required: false
        schema:
          type: string
      - description: can be used with limit above to scroll through the list
        name: offset
        in: query
        required: false
        schema:
          type: string
      - name: league
        in: path
        required: true
        schema:
          type: string
