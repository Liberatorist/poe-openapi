servers:
- url: https://api.pathofexile.com
components:
  schemas:
    League:
      type: object
      properties:
        id:
          type: string
          description: the league's name
        realm:
          type: string
          enum:
          - pc
          - xbox
          - sony
          description: pc, xbox, or sony
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
              description: the league category, e.g. Affliction
            current:
              type: boolean
              enum:
              - true
              description: set for the active challenge leagues; always true if present
          required:
          - id
        rules:
          type: array
          items:
            $ref: '#/components/schemas/LeagueRule'
        registerAt:
          type: string
          format: date-time
          description: date time (ISO8601)
        event:
          type: boolean
          enum:
          - true
          description: always true if present
        url:
          type: string
          description: a url link to a Path of Exile forum thread
        startAt:
          type: string
          format: date-time
          description: date time (ISO8601)
        endAt:
          type: string
          format: date-time
          description: date time (ISO8601)
        timedEvent:
          type: boolean
          enum:
          - true
          description: always true if present
        scoreEvent:
          type: boolean
          enum:
          - true
          description: always true if present
        delveEvent:
          type: boolean
          enum:
          - true
          description: always true if present
        ancestorEvent:
          type: boolean
          enum:
          - true
          description: always true if present
        leagueEvent:
          type: boolean
          enum:
          - true
          description: always true if present
      required:
      - id
    LeagueRule:
      type: object
      properties:
        id:
          type: string
          enum:
          - Hardcore
          - NoParties
          description: 'examples: Hardcore, NoParties (SSF)'
        name:
          type: string
        description:
          type: string
      required:
      - id
      - name
    LadderEntry:
      type: object
      properties:
        rank:
          type: integer
          format: uint32
        dead:
          type: boolean
        retired:
          type: boolean
        ineligible:
          type: boolean
        public:
          type: boolean
        character:
          type: object
          properties:
            id:
              type: string
              description: a unique 64 digit hexadecimal string
            name:
              type: string
            level:
              type: integer
              format: uint32
            class:
              type: string
            time:
              type: integer
              format: uint32
              description: time taken to complete the league objective in seconds
            score:
              type: integer
              format: uint32
              description: count of league objective completions
            progress:
              type: object
              properties: {}
              description: the values of this depend on the league objective
            experience:
              type: integer
              format: uint32
            depth:
              type: object
              properties:
                default:
                  type: integer
                  format: uint32
                solo:
                  type: integer
                  format: uint32
              description: deepest Delve depth completed
          required:
          - class
          - id
          - level
          - name
        account:
          $ref: '#/components/schemas/Account'
      required:
      - character
      - rank
    EventLadderEntry:
      type: object
      properties:
        rank:
          type: integer
          format: uint32
        ineligible:
          type: boolean
        time:
          type: integer
          format: uint32
