              - Garukhan
              - Ryslatha
              description: PoE1 only; one of Abberath, Gruthkul, Yugul, Shakari, Tukohama,
                Ralakesh, Garukhan, or Ryslatha
            jewel_data:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ItemJewelData'
              description: the key is the string value of the x property of an item
                from the jewels array in this request
            alternate_ascendancy:
              type: string
              enum:
              - Warden
              - Warlock
              - Primalist
              description: PoE1 only; Warden, Warlock, or Primalist
          required:
          - hashes
          - hashes_ex
          - jewel_data
          - mastery_effects
          - skill_overrides
          - specialisations
        metadata:
          type: object
          properties:
            version:
              type: string
              description: game version for the character's realm
      required:
      - class
      - experience
      - id
      - level
      - name
      - realm
    ItemJewelData:
      type: object
      properties:
        type:
          type: string
        radius:
          type: integer
          format: uint32
        radiusMin:
          type: integer
          format: uint32
        radiusVisual:
          type: string
        subgraph:
          type: object
          properties:
            groups:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PassiveGroup'
              description: the key is the string value of the group id
            nodes:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PassiveNode'
              description: the key is the string value of the node identifier
          required:
          - groups
          - nodes
          description: only present on cluster jewels
      required:
      - type
    StashTab:
      type: object
      properties:
        id:
          type: string
          description: a 10 digit hexadecimal string
        parent:
          type: string
          description: a 10 digit hexadecimal string
        name:
          type: string
        type:
          type: string
        index:
          type: integer
          format: uint32
        metadata:
          type: object
          properties:
            public:
              type: boolean
              enum:
              - true
              description: always true if present
            folder:
              type: boolean
              enum:
              - true
              description: always true if present
            colour:
              type: string
              description: 6 digit hex colour
        children:
          type: array
          items:
            $ref: '#/components/schemas/StashTab'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - id
      - metadata
      - name
      - type
    LeagueAccount:
      type: object
      properties:
        atlas_passives:
          type: object
          properties:
            hashes:
              type: array
              items:
                type: integer
                format: uint32
          required:
          - hashes
        atlas_passive_trees:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              hashes:
                type: array
                items:
                  type: integer
                  format: uint32
            required:
            - hashes
            - name
      required:
      - atlas_passive_trees
    ItemFilter:
      type: object
      properties:
        id:
          type: string
        filter_name:
          type: string
        realm:
          type: string
        description:
          type: string
        version:
          type: string
        type:
          type: string
          enum:
          - Normal
          - Ruthless
          description: either Normal or Ruthless
        public:
          type: boolean
          enum:
          - true
          description: always true if present
        filter:
          type: string
          description: not present when listing all filters
        validation:
          type: object
          properties:
            valid:
              type: boolean
            version:
              type: string
              description: game version
            validated:
              type: string
              format: date time (ISO8601)
          required:
          - valid
          description: not present when listing all filters
      required:
      - description
      - filter_name
      - id
      - realm
      - type
      - version
    PassiveGroup:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        orbits:
          type: array
          items:
            type: integer
            format: uint32
        isProxy:
          type: boolean
          enum:
          - true
          description: always true if present
        proxy:
          type: string
          description: identifier of the placeholder node
        nodes:
          type: array
          items:
            type: string
          description: the node identifiers associated with this group
      required:
      - nodes
      - orbits
      - x
      - y
    PassiveNode:
      type: object
      properties:
        skill:
          type: integer
          format: uint32
          description: skill hash
        name:
          type: string
        icon:
          type: string
        isKeystone:
          type: boolean
          enum:
          - true
          description: always true if present
        isNotable:
          type: boolean
          enum:
          - true
          description: always true if present
        isMastery:
          type: boolean
          enum:
          - true
          description: always true if present
        inactiveIcon:
          type: string
          description: inactive mastery image
        activeIcon:
          type: string
          description: active mastery image
        activeEffectImage:
          type: string
          description: active mastery or tattoo background image
        masteryEffects:
          type: array
          items:
            type: object
            properties:
              effect:
                type: integer
                format: uint32
                description: effect hash
              stats:
                type: array
                items:
                  type: string
                description: stat descriptions
              reminderText:
                type: array
                items:
                  type: string
            required:
            - effect
            - stats
        isBlighted:
          type: boolean
          enum:
          - true
          description: always true if present
        isTattoo:
          type: boolean
          enum:
          - true
          description: always true if present
        isProxy:
          type: boolean
          enum:
          - true
          description: always true if present
        isJewelSocket:
          type: boolean
          enum:
          - true
          description: always true if present
        expansionJewel:
          type: object
          properties:
            size:
              type: integer
              format: uint32
            index:
              type: integer
              format: uint32
            proxy:
              type: integer
              format: uint32
              description: the proxy node identifier
            parent:
              type: integer
              format: uint32
              description: the parent node identifier
          description: cluster jewel information
        recipe:
          type: array
          items:
            type: string
          description: "components required for Blight crafting this node.\n     \
            \       each string is one of ClearOil, SepiaOil, AmberOil, VerdantOil,\n\
            TealOil, AzureOil, IndigoOil, VioletOil, CrimsonOil,\nBlackOil, OpalescentOil,\
            \ SilverOil, GoldenOil, or PrismaticOil"
        grantedStrength:
          type: integer
          format: uint32
          description: sum of stats on this node that grant strength
        grantedDexterity:
          type: integer
          format: uint32
          description: sum of stats on this node that grant dexterity
        grantedIntelligence:
          type: integer
          format: uint32
          description: sum of stats on this node that grant intelligence
        ascendancyName:
          type: string
        isAscendancyStart:
          type: boolean
          enum:
          - true
          description: always true if present
        isMultipleChoice:
          type: boolean
          enum:
          - true
          description: always true if present
        isMultipleChoiceOption:
          type: boolean
          enum:
          - true
          description: always true if present
        grantedPassivePoints:
          type: integer
          format: uint32
        stats:
          type: array
          items:
            type: string
          description: stat descriptions
        reminderText:
          type: array
          items:
            type: string
        flavourText:
          type: array
          items:
            type: string
        classStartIndex:
          type: integer
          format: uint32
        group:
          type: string
          description: the key value to look up in the groups table
        orbit:
          type: integer
          format: uint32
          description: the orbit this node occupies within it's group
        orbitIndex:
          type: integer
          format: uint32
          description: the index of this node in the group's orbit
        out:
          type: array
          items:
            type: string
          description: node identifiers of nodes this one connects to
        in:
          type: array
          items:
            type: string
          description: node identifiers of nodes connected to this one
      required:
      - in
      - out
    CrucibleNode:
      type: object
      properties:
        skill:
          type: integer
          format: uint32
          description: mod hash
        tier:
          type: integer
          format: uint32
          description: mod tier
        icon:
          type: string
        allocated:
          type: boolean
          enum:
          - true
          description: always true if present
        isNotable:
          type: boolean
          enum:
          - true
          description: always true if present
        isReward:
          type: boolean
          enum:
          - true
          description: always true if present
        stats:
          type: array
          items:
            type: string
          description: stat descriptions
        reminderText:
          type: array
          items:
            type: string
        orbit:
          type: integer
          format: uint32
          description: the column this node occupies
        orbitIndex:
          type: integer
          format: uint32
          description: the node's position within the column
        out:
          type: array
          items:
            type: string
          description: node identifiers of nodes this one connects to
        in:
          type: array
          items:
            type: string
          description: node identifiers of nodes connected to this one
      required:
      - in
      - out
    GemTab:
      type: object
      properties:
        name:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/GemPage'
      required:
      - pages
    GemPage:
      type: object
      properties:
        skillName:
          type: string
        description:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ItemProperty'
        stats:
          type: array
          items:
            type: string
  securitySchemes:
    service:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://www.pathofexile.com/oauth/token
          scopes:
            service:leagues: for fetching leagues.
            service:leagues:ladder: for fetching league ladders.
            service:pvp_matches: for fetching PvP matches.
            service:pvp_matches:ladder: for fetching PvP match ladders.
            service:psapi: for access to the Public Stash API.
    account:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://www.pathofexile.com/oauth/token
          authorizationUrl: https://www.pathofexile.com/oauth/authorize
          scopes:
            account:profile: for access to the account's basic profile information.
            account:leagues: for viewing the account's available leagues (including
              private leagues).
            account:stashes: for viewing the account's stashes and items.
            account:characters: for viewing the account's characters and inventories.
            account:league_accounts: for viewing the account's allocated atlas passives.
            account:item_filter: for managing the account's item filters.
    bearerAuth:
      type: http
      scheme: bearer
tags:
- name: Account Profile
- name: Account Item Filters
- name: Leagues
- name: PvP Matches (PoE1 only)
- name: Account Leagues (PoE1 only)
- name: Account Characters
- name: Account Stashes (PoE1 only)
- name: League Accounts (PoE1 only)
- name: Guild Stashes (PoE1 only)
- name: Public Stashes (PoE1 only)
