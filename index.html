<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Path of Exile API — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; }
    .github-link {
      position: absolute;
      top: 14px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      opacity: 0.85;
    }
    .github-link:hover { opacity: 1; }
    .github-link svg { fill: #fff; flex-shrink: 0; }
    /* once moved inside the topbar, center between the logo and the spec selector;
       the strong selector beats swagger-ui's own .topbar a rules (flex: 1, large bold font) */
    .swagger-ui .topbar .github-link {
      position: static;
      flex: 0 0 auto;
      margin: 0 auto;
      white-space: nowrap;
      font-size: 16px;
      align-items: center;
      color: #fff;
    }
    .swagger-ui .topbar .github-link svg { height: 22px; width: 22px; }
  </style>
</head>
<body>
  <a class="github-link" href="https://github.com/Liberatorist/poe-openapi" target="_blank" rel="noopener">
    <svg height="28" width="28" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span>Liberatorist/poe-openapi</span>
  </a>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      urls: [
        { url: "out/openapi-poe1.json", name: "Path of Exile" },
        { url: "out/openapi-poe2.json", name: "Path of Exile 2" },
        { url: "out/openapi-xbox.json", name: "Path of Exile (Xbox)" },
        { url: "out/openapi-sony.json", name: "Path of Exile (Sony)" }
      ],
      "urls.primaryName": "Path of Exile",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout"
    });

    const moveLink = setInterval(() => {
      const topbar = document.querySelector(".topbar-wrapper");
      const link = document.querySelector(".github-link");
      if (topbar && link) {
        topbar.insertBefore(link, topbar.querySelector(".download-url-wrapper"));
        clearInterval(moveLink);
      }
    }, 100);
  </script>
</body>
</html>
